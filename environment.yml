name: inspired-dev 
channels:
  - conda-forge
dependencies:
  - anaconda-client
  - boa
  - check-wheel-contents
  - conda-build
  - conda-verify
  - toml
  - setuptools
  - pre-commit
  - python == 3.10.*
  - python-build
  - versioningit
  - pandas
  - qtpy
  - spglib
  - seekpath
  - phonopy==2.28.0
  - pymace
  - pip
  - pip:
    - --extra-index-url https://download.pytorch.org/whl/cpu
    - --find-links https://pytorch-geometric.com/whl/torch-2.6.0+cpu.html
    - torch==2.6.0
    - torch-geometric
    - torch-sparse
    - torch-scatter
    - torch-cluster
    - mattersim
    - sevenn
    - orb-models
    - e3nn==0.5.0
    - pyqt5
